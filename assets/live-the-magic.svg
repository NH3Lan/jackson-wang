<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" width="800" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&amp;display=swap');
      .magic-text {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-weight: 300;
        font-size: 44px;
        fill: #f0ece4;
        letter-spacing: 8px;
      }
    </style>
  </defs>
  <!-- background -->
  <rect width="800" height="110" fill="#0f0f0f"/>
  <!-- decorative left line -->
  <line x1="60" y1="54" x2="240" y2="54" stroke="#c9a96e" stroke-width="0.6" opacity="0.65"/>
  <!-- decorative right line -->
  <line x1="560" y1="54" x2="740" y2="54" stroke="#c9a96e" stroke-width="0.6" opacity="0.65"/>
  <!-- main text -->
  <text x="400" y="68" class="magic-text" text-anchor="middle">Live the magic.</text>
</svg>
